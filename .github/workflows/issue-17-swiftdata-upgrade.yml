name: Issue 17 SwiftData Upgrade Test

on:
  workflow_dispatch:
    inputs:
      old_ref:
        description: Commit with the previous CachedTask schema
        required: true
        type: string
      candidate_ref:
        description: Candidate commit with the new CachedTask schema
        required: true
        type: string

permissions:
  contents: read

jobs:
  upgrade-store:
    name: Upgrade existing SwiftData store
    runs-on: macos-latest
    steps:
      - name: Checkout previous version
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.old_ref }}
          path: old

      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Boot clean simulator
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl erase all || true
          xcrun simctl boot "iPhone 17"
          xcrun simctl bootstatus booted -b

      - name: Build and launch previous app to create its store
        working-directory: old
        run: |
          set -euxo pipefail
          xcodegen generate
          xcodebuild \
            -project mDone.xcodeproj \
            -scheme mDone \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath ../derived-old \
            build
          xcrun simctl install booted ../derived-old/Build/Products/Debug-iphonesimulator/mDone.app
          LAUNCH_OUTPUT=$(xcrun simctl launch booted com.mdone.app)
          printf '%s\n' "$LAUNCH_OUTPUT"
          PID=${LAUNCH_OUTPUT##*: }
          sleep 8
          /bin/kill -0 "$PID"
          OLD_CONTAINER=$(xcrun simctl get_app_container booted com.mdone.app group.com.mdone.app)
          STORE_RELATIVE_PATH="Library/Application Support/default.store"
          test -f "$OLD_CONTAINER/$STORE_RELATIVE_PATH"
          printf '%s\n' "$OLD_CONTAINER" > ../old-container-path.txt
          printf '%s\n' "$STORE_RELATIVE_PATH" > ../old-store-relative-path.txt
          xcrun simctl terminate booted com.mdone.app

      - name: Install candidate over existing store and verify successful launch
        working-directory: candidate
        run: |
          set -euxo pipefail
          xcodegen generate
          xcodebuild \
            -project mDone.xcodeproj \
            -scheme mDone \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath ../derived-candidate \
            build
          xcrun simctl install booted ../derived-candidate/Build/Products/Debug-iphonesimulator/mDone.app
          NEW_CONTAINER=$(xcrun simctl get_app_container booted com.mdone.app group.com.mdone.app)
          read -r OLD_CONTAINER < ../old-container-path.txt
          read -r STORE_RELATIVE_PATH < ../old-store-relative-path.txt
          test "$NEW_CONTAINER" = "$OLD_CONTAINER"
          test -f "$NEW_CONTAINER/$STORE_RELATIVE_PATH"
          LAUNCH_OUTPUT=$(xcrun simctl launch booted com.mdone.app)
          printf '%s\n' "$LAUNCH_OUTPUT"
          PID=${LAUNCH_OUTPUT##*: }
          sleep 8
          /bin/kill -0 "$PID"
          test -f "$NEW_CONTAINER/$STORE_RELATIVE_PATH"
          python3 - "$NEW_CONTAINER/$STORE_RELATIVE_PATH" <<'PY'
          import sqlite3
          import sys
          store = sys.argv[1]
          with sqlite3.connect(store) as connection:
              columns = {row[1] for row in connection.execute('PRAGMA table_info(ZCACHEDTASK)')}
          print({'cached_task_columns_added': sorted(columns & {'ZSTARTDATE', 'ZENDDATE'})})
          missing = {'ZSTARTDATE', 'ZENDDATE'} - columns
          if missing:
              raise SystemExit(f'Migrated store is missing columns: {sorted(missing)}')
          PY
