name: Issue 17 SwiftData Upgrade Test

on:
  workflow_dispatch:
    inputs:
      old_ref:
        description: Commit with the previous CachedTask schema
        required: true
        type: string
      candidate_ref:
        description: Candidate commit with the new CachedTask schema
        required: true
        type: string

permissions:
  contents: read

jobs:
  upgrade-store:
    name: Upgrade existing SwiftData store
    runs-on: macos-latest
    steps:
      - name: Checkout previous version
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.old_ref }}
          path: old

      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Boot clean simulator
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl erase all || true
          xcrun simctl boot "iPhone 17"
          xcrun simctl bootstatus booted -b

      - name: Build and launch previous app to create its store
        working-directory: old
        run: |
          set -euxo pipefail
          xcodegen generate
          xcodebuild \
            -project mDone.xcodeproj \
            -scheme mDone \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath ../derived-old \
            build
          xcrun simctl install booted ../derived-old/Build/Products/Debug-iphonesimulator/mDone.app
          LAUNCH_OUTPUT=$(xcrun simctl launch booted com.mdone.app)
          printf '%s\n' "$LAUNCH_OUTPUT"
          PID=${LAUNCH_OUTPUT##*: }
          sleep 8
          if ! xcrun simctl spawn booted kill -0 "$PID"; then
            xcrun simctl spawn booted log show --last 2m --predicate 'process == "mDone"' --style compact
            exit 1
          fi
          OLD_CONTAINER=$(xcrun simctl get_app_container booted com.mdone.app data)
          printf '%s\n' "$OLD_CONTAINER" > ../old-container-path.txt
          python3 - "$OLD_CONTAINER" ../old-store-relative-path.txt <<'PY'
          import os
          import sys
          root, output = sys.argv[1:]
          stores = []
          for directory, _, files in os.walk(root):
              for filename in files:
                  if filename.endswith('.store'):
                      stores.append(os.path.relpath(os.path.join(directory, filename), root))
          print({'container': root, 'stores': stores})
          if len(stores) != 1:
              raise SystemExit(f'Expected exactly one SwiftData store, found {stores}')
          with open(output, 'w') as handle:
              handle.write(stores[0])
          PY
          xcrun simctl terminate booted com.mdone.app

      - name: Install candidate over existing store and verify successful launch
        working-directory: candidate
        run: |
          set -euxo pipefail
          xcodegen generate
          xcodebuild \
            -project mDone.xcodeproj \
            -scheme mDone \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath ../derived-candidate \
            build
          xcrun simctl install booted ../derived-candidate/Build/Products/Debug-iphonesimulator/mDone.app
          NEW_CONTAINER=$(xcrun simctl get_app_container booted com.mdone.app data)
          read -r OLD_CONTAINER < ../old-container-path.txt
          read -r STORE_RELATIVE_PATH < ../old-store-relative-path.txt
          test "$NEW_CONTAINER" = "$OLD_CONTAINER"
          test -f "$NEW_CONTAINER/$STORE_RELATIVE_PATH"
          LAUNCH_OUTPUT=$(xcrun simctl launch booted com.mdone.app)
          printf '%s\n' "$LAUNCH_OUTPUT"
          PID=${LAUNCH_OUTPUT##*: }
          sleep 8
          if ! xcrun simctl spawn booted kill -0 "$PID"; then
            xcrun simctl spawn booted log show --last 2m --predicate 'process == "mDone"' --style compact
            exit 1
          fi
          test -f "$NEW_CONTAINER/$STORE_RELATIVE_PATH"
