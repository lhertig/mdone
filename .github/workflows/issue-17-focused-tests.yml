name: Issue 17 Focused Tests

on:
  workflow_dispatch:
    inputs:
      test_ref:
        description: Branch or commit to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  task-service-tests:
    name: TaskServiceTests (iOS Simulator)
    runs-on: macos-latest
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.test_ref }}

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Run focused tests
        run: |
          xcodebuild \
            -project mDone.xcodeproj \
            -scheme mDone \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:mDoneTests/TaskServiceTests \
            test
